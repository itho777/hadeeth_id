<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="HADEETH.ID — Biographies & Transmission profiles of 24,000+ Hadith Scholars, Sahabah, and Narrators."/>
  <title>Scholars & Narrators - HADEETH.ID</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/app.css?v=20260808_20"/>
  <script src="js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
  const supabaseUrl = 'https://idokyspokenbmzoegahq.supabase.co';
  const anonKey = 'sb_publishable_Hz6k4Jp7rdSxwXCk1AO-sQ_r93N88QR';

  // Canonical Arabic names mapping for Rijal IDs & names
  const arNameDict = {
    'abu_darda': 'أبو الدرداء',
    'abu darda': 'أبو الدرداء',
    'zayd_ibn_thabit': 'زيد بن ثابت',
    'zayd ibn thabit': 'زيد بن ثابت',
    'uqbah_ibn_amir': 'عقبة بن عامر',
    'uqbah ibn amir': 'عقبة بن عامر',
    'abd_allah_ibn_abbas': 'عبد الله بن عباس',
    'abdullah_bin_abbas': 'عبد الله بن عباس',
    'abdullah bin abbas': 'عبد الله بن عباس',
    'umar_ibn_abi_salama': 'عمر بن أبي سلمة',
    'umar ibn abi salama': 'عمر بن أبي سلمة',
    'q6732822': 'أنس بن مالك',
    'abu_hurairah': 'أبو هريرة',
    'aisha_bint_abi_bakr': 'عائشة بنت أبي بكر',
    'umar_ibn_al_khattab': 'عمر بن الخطاب',
    'anas_bin_malik': 'أنس بن مالك',
    'malik_bin_anas': 'مالك بن أنس',
    'al_bukhari': 'محمد بن إسماعيل البخاري',
    'muslim_ibn_hajjaj': 'مسلم بن الحجاج',
    'abu_dawud': 'أبو داود السجستاني',
    'al_tirmidhi': 'أبو عيسى الترمذي',
    'al_nasai': 'أحمد بن شعيب النسائي',
    'ibn_majah': 'ابن ماجه القزويني'
  };

  function getCleanArabicName(r) {
    if (r.name_ar && !r.name_ar.startsWith('Q') && /[\u0600-\u06FF]/.test(r.name_ar)) {
      return r.name_ar;
    }
    const slug = (r.id || '').toLowerCase();
    const nameLow = (r.name_en || '').toLowerCase();
    return arNameDict[slug] || arNameDict[nameLow] || (r.name_ar && !r.name_ar.startsWith('Q') ? r.name_ar : '');
  }

  function getCleanEnglishName(r) {
    if (r.id === 'Q6732822' || r.name_en === 'Q6732822') return 'Anas bin Malik (رضي الله عنه)';
    return r.name_en || 'Scholar';
  }

  let allScholars = [];
  let currentPage = 1;
  const pageSize = 9; // Exactly 3 rows x 3 columns = 9 cards per page
  let activeGen = 'all';
  let activeRole = 'all';
  let searchQuery = '';

  document.addEventListener('DOMContentLoaded', async () => {
    await fetchAndRenderScholars();

    window.addEventListener('hadeeth_lang_change', () => {
      renderScholarsPage();
    });

    const prevBtn = document.getElementById('scholars-prev-btn');
    const nextBtn = document.getElementById('scholars-next-btn');
    if (prevBtn) {
      prevBtn.addEventListener('click', () => {
        if (currentPage > 1) {
          currentPage--;
          renderScholarsPage();
          window.scrollTo({ top: 300, behavior: 'smooth' });
        }
      });
    }
    if (nextBtn) {
      nextBtn.addEventListener('click', () => {
        const totalPages = Math.ceil(allScholars.length / pageSize) || 1;
        if (currentPage < totalPages) {
          currentPage++;
          renderScholarsPage();
          window.scrollTo({ top: 300, behavior: 'smooth' });
        }
      });
    }
  });

  async function fetchAndRenderScholars(gen = 'all', role = 'all', query = '') {
    activeGen = gen;
    activeRole = role;
    searchQuery = query;
    currentPage = 1;

    const grid = document.getElementById('scholars-grid');
    if (!grid) return;

    try {
      let url = `${supabaseUrl}/rest/v1/rijal?select=*&order=hadith_count.desc,died_ah.asc&limit=100`;
      if (activeGen === 'sahabah') {
        url += '&is_sahabi=eq.true';
      } else if (activeGen === 'tabiun') {
        url += '&generation=eq.Tabi\'i';
      } else if (activeGen === 'collectors') {
        url += '&generation=eq.Collector';
      }

      if (searchQuery) {
        url += `&name_en=ilike.*${encodeURIComponent(searchQuery)}*`;
      }

      const res = await fetch(url, {
        headers: { 'apikey': anonKey, 'Authorization': `Bearer ${anonKey}` }
      });

      if (res.ok) {
        const data = await res.json();
        if (data && data.length > 0) {
          allScholars = data;
        } else {
          allScholars = [];
        }
      }
    } catch (err) {
      console.warn('Error fetching scholars from Supabase:', err);
      allScholars = [];
    }

    renderScholarsPage();
  }

  function renderScholarsPage() {
    const grid = document.getElementById('scholars-grid');
    const pageIndicator = document.getElementById('scholars-page-indicator');
    const pageNumber = document.getElementById('scholars-page-number');
    const prevBtn = document.getElementById('scholars-prev-btn');
    const nextBtn = document.getElementById('scholars-next-btn');

    if (!grid) return;

    if (!allScholars || allScholars.length === 0) {
      const isId = (window.LangSystem && window.LangSystem.isIdMode());
      grid.innerHTML = `
        <div class="col-span-3 p-8 text-center bg-surface dark:bg-[#1e293b] rounded-xl border border-outline-variant/20 dark:border-[#334155]">
          <span class="material-symbols-outlined text-outline dark:text-gray-500 text-4xl">search_off</span>
          <h3 class="mt-2 font-bold text-primary dark:text-white">${isId ? 'Tidak ada perawi ditemukan' : 'No narrators found'}</h3>
          <p class="text-xs text-outline dark:text-gray-400 mt-1">${isId ? 'Coba ubah kata kunci atau filter pencarian.' : 'Try changing search query or filter chips.'}</p>
        </div>
      `;
      if (pageIndicator) pageIndicator.innerText = isId ? '0 dari 0 Perawi' : '0 of 0 Narrators';
      if (pageNumber) pageNumber.innerText = isId ? 'Halaman 1 dari 1' : 'Page 1 of 1';
      if (prevBtn) prevBtn.disabled = true;
      if (nextBtn) nextBtn.disabled = true;
      return;
    }

    const totalPages = Math.ceil(allScholars.length / pageSize) || 1;
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;

    const startIdx = (currentPage - 1) * pageSize;
    const endIdx = Math.min(startIdx + pageSize, allScholars.length);
    const pageItems = allScholars.slice(startIdx, endIdx);

    const isId = (window.LangSystem && window.LangSystem.isIdMode());
    let html = '';

    pageItems.forEach(r => {
      const isSahabi = r.is_sahabi;
      const cleanNameEn = getCleanEnglishName(r);
      const cleanNameAr = getCleanArabicName(r);
      const profileUrl = `profile-detail.html?id=${encodeURIComponent(r.id)}`;

      let genLabel = r.generation || (isSahabi ? (isId ? 'Sahabat' : 'Sahabi (Companion)') : 'Rawi');
      if (isId) {
        genLabel = genLabel
          .replace(/Sahabi\s*\(Companion\)/ig, 'Sahabat')
          .replace(/Sahabi/ig, 'Sahabat')
          .replace(/Transmitter/ig, 'Rawi')
          .replace(/Collector/ig, 'Penghimpun');
      }

      let dateStr = '';
      if (r.died_ah) dateStr += isId ? `Wafat: ${r.died_ah} H` : `Died: ${r.died_ah} AH`;
      if (r.died_ce) dateStr += ` (${r.died_ce} M)`;
      if (r.city_of_death || r.region) dateStr += ` &bull; ${r.city_of_death || r.region}`;

      const gradeStr = isId ? `Derajat: ${r.grade || 'Tsiqah'}` : `Grade: ${r.grade || 'Thiqah'}`;
      const hadithCountStr = isId ? `${r.hadith_count || 0} Hadits Terkait` : `${r.hadith_count || 0} Hadith Links`;
      const viewProfileStr = isId ? 'Lihat Profil &rarr;' : 'View Profile &rarr;';
      const booksStr = (r.books && r.books.length) ? (isId ? 'Kitab: ' + r.books.join(', ') : 'Books: ' + r.books.join(', ')) : (isId ? 'Koleksi Kitab Utama' : 'Canonical Collections');

      html += `
        <div class="scholar-card bg-surface dark:bg-[#1e293b] border border-outline-variant/20 dark:border-[#334155] rounded-xl p-5 flex flex-col justify-between card-lift" data-gen="${isSahabi ? 'sahabah' : 'other'}">
          <div>
            <div class="flex justify-between items-start mb-3">
              <span class="bg-sunan-emerald/10 text-sunan-emerald dark:text-[#10b981] text-[10px] font-bold px-2 py-0.5 rounded uppercase">${escapeHtml(genLabel)}</span>
              ${cleanNameAr ? `<span class="font-arabic-body text-lg text-secondary dark:text-[#10b981]" dir="rtl">${escapeHtml(cleanNameAr)}</span>` : ''}
            </div>
            <h3 class="font-bold text-base text-primary dark:text-white">${escapeHtml(cleanNameEn)}</h3>
            <p class="text-xs text-outline dark:text-gray-400 mt-1">${escapeHtml(dateStr || (isId ? 'Masa Awal Islam' : 'Early Era'))}</p>
            <div class="flex items-center gap-2 mt-2 text-xs font-semibold">
              <span class="text-sunan-emerald dark:text-[#10b981]">${escapeHtml(gradeStr)}</span>
              <span>&bull;</span>
              <span class="text-primary dark:text-white">${escapeHtml(hadithCountStr)}</span>
            </div>
            <p class="text-xs text-on-surface-variant dark:text-gray-400 mt-2 line-clamp-2">${escapeHtml(r.bio_en || (r.kunya_en ? `Kunyah: ${r.kunya_en}` : (isId ? 'Perawi otentik dalam kumpulan kitab Hadits utama.' : 'Authentic transmitter in canonical Hadith collections.')))}</p>
          </div>
          <div class="mt-4 pt-3 border-t border-outline-variant/10 dark:border-[#334155] flex justify-between items-center text-xs font-semibold text-secondary dark:text-[#10b981]">
            <span>${escapeHtml(booksStr)}</span>
            <a href="${profileUrl}" class="hover:underline flex items-center gap-1">${viewProfileStr}</a>
          </div>
        </div>
      `;
    });

    grid.innerHTML = html;

    // Update Pagination Controls
    if (pageIndicator) pageIndicator.innerText = isId
      ? `Menampilkan ${startIdx + 1}–${endIdx} dari ${allScholars.length} Perawi`
      : `Showing ${startIdx + 1}–${endIdx} of ${allScholars.length} Narrators`;

    if (pageNumber) pageNumber.innerText = isId
      ? `Halaman ${currentPage} dari ${totalPages}`
      : `Page ${currentPage} of ${totalPages}`;

    if (prevBtn) prevBtn.disabled = (currentPage <= 1);
    if (nextBtn) nextBtn.disabled = (currentPage >= totalPages);
  }

  document.querySelectorAll('#generation-chips button').forEach(btn => {
    btn.addEventListener('click', async () => {
      document.querySelectorAll('#generation-chips button').forEach(b => {
        b.classList.remove('bg-primary', 'dark:bg-[#10b981]', 'text-white', 'dark:text-black', 'active');
        b.classList.add('bg-surface-container-high', 'dark:bg-[#1e293b]', 'text-on-surface-variant', 'dark:text-gray-300');
      });
      btn.classList.remove('bg-surface-container-high', 'dark:bg-[#1e293b]', 'text-on-surface-variant', 'dark:text-gray-300');
      btn.classList.add('bg-primary', 'dark:bg-[#10b981]', 'text-white', 'dark:text-black', 'active');

      const gen = btn.dataset.gen;
      const role = document.querySelector('#role-chips button.active')?.dataset.role || 'all';
      const searchVal = document.getElementById('scholar-search')?.value || '';
      await fetchAndRenderScholars(gen, role, searchVal);
    });
  });

  document.querySelectorAll('#role-chips button').forEach(btn => {
    btn.addEventListener('click', async () => {
      document.querySelectorAll('#role-chips button').forEach(b => {
        b.classList.remove('bg-secondary', 'dark:bg-[#10b981]', 'text-white', 'dark:text-black', 'active');
        b.classList.add('bg-surface-container-high', 'dark:bg-[#1e293b]', 'text-on-surface-variant', 'dark:text-gray-300');
      });
      btn.classList.remove('bg-surface-container-high', 'dark:bg-[#1e293b]', 'text-on-surface-variant', 'dark:text-gray-300');
      btn.classList.add('bg-secondary', 'dark:bg-[#10b981]', 'text-white', 'dark:text-black', 'active');

      const role = btn.dataset.role;
      const gen = document.querySelector('#generation-chips button.active')?.dataset.gen || 'all';
      const searchVal = document.getElementById('scholar-search')?.value || '';
      await fetchAndRenderScholars(gen, role, searchVal);
    });
  });

  let searchTimeout;
  document.getElementById('scholar-search')?.addEventListener('input', (e) => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(async () => {
      const gen = document.querySelector('#generation-chips button.active')?.dataset.gen || 'all';
      const role = document.querySelector('#role-chips button.active')?.dataset.role || 'all';
      await fetchAndRenderScholars(gen, role, e.target.value.trim());
    }, 300);
  });

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }
</script>
</body>
</html>
