name: Build Android APK

on:
  push:
    branches: [mobile]
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # The Supabase anon key is public by design and is never committed: it
      # reaches the compiler only as --dart-define. A repository secret wins when
      # it exists; otherwise the key is read from the live site's config.js, the
      # same file the web client loads. With neither, the build stays local-only.
      - name: Resolve Supabase anon key
        id: key
        env:
          SECRET_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          KEY="${SECRET_KEY:-}"
          if [ -z "$KEY" ]; then
            KEY=$(curl -fsSL --max-time 30 https://hadeeth.id/js/config.js \
              | grep -oE 'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}' \
              | head -n1 || true)
          fi
          if [ -n "$KEY" ]; then
            echo "::add-mask::$KEY"
            echo "Using a $(printf '%s' "$KEY" | wc -c)-character anon key."
          else
            echo "::warning::No anon key found; the APK will be local-only without sign-in."
          fi
          {
            echo 'key<<APK_EOF'
            printf '%s\n' "$KEY"
            echo 'APK_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # Golden files are rendered on Windows, so only the widget/unit suite runs
      # here; a font difference would otherwise fail an otherwise correct build.
      - name: Test
        run: flutter test test/app_test.dart

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_ANON_KEY='${{ steps.key.outputs.key }}'

      - name: Report artifact
        run: |
          ls -l build/app/outputs/flutter-apk/app-release.apk
          echo "### APK" >> "$GITHUB_STEP_SUMMARY"
          echo "\`app-release.apk\` — $(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: \`$(sha256sum build/app/outputs/flutter-apk/app-release.apk | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hadeeth-id-mobile-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90
