name: Build Release Artifacts

on:
  push:
    branches: [mobile]
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
  workflow_dispatch:
    inputs:
      build_aab:
        description: 'Build Android App Bundle (AAB)'
        type: boolean
        default: true
      build_ipa:
        description: 'Build iOS App (IPA) — requires Apple Developer credentials'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_aab }}
    name: Android AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Resolve Supabase anon key
        id: key
        env:
          SECRET_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          KEY="${SECRET_KEY:-}"
          if [ -z "$KEY" ]; then
            KEY=$(curl -fsSL --max-time 30 https://hadeeth.id/js/config.js \
              | grep -oE 'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}' \
              | head -n1 || true)
          fi
          if [ -n "$KEY" ]; then
            echo "::add-mask::$KEY"
            echo "Using a $(printf '%s' "$KEY" | wc -c)-character anon key."
          else
            echo "::warning::No anon key found; the build will be local-only without sign-in."
          fi
          {
            echo 'key<<APK_EOF'
            printf '%s\n' "$KEY"
            echo 'APK_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test (widget/unit only)
        run: flutter test test/app_test.dart

      - name: Build release AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/hadeeth-release.jks
            echo "storeFile=../app/hadeeth-release.jks" > android/key.properties
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD" >> android/key.properties
            echo "keyAlias=release" >> android/key.properties
            echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
            echo "Keystore configured for release signing."
          else
            echo "::warning::Keystore secrets not set; build will use debug signing (not Play-store valid)."
          fi
          flutter build appbundle --release \
            --dart-define=SUPABASE_ANON_KEY='${{ steps.key.outputs.key }}'

      - name: Report artifact
        run: |
          ls -l build/app/outputs/bundle/release/app-release.aab
          echo "### Android App Bundle" >> "$GITHUB_STEP_SUMMARY"
          echo "\`app-release.aab\` — $(du -h build/app/outputs/bundle/release/app-release.aab | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: \`$(sha256sum build/app/outputs/bundle/release/app-release.aab | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: hadeeth-id-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

  ios:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_ipa }}
    name: iOS IPA
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Resolve Supabase anon key
        id: key
        env:
          SECRET_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          KEY="${SECRET_KEY:-}"
          if [ -z "$KEY" ]; then
            KEY=$(curl -fsSL --max-time 30 https://hadeeth.id/js/config.js \
              | grep -oE 'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}' \
              | head -n1 || true)
          fi
          if [ -n "$KEY" ]; then
            echo "::add-mask::$KEY"
            echo "Using a $(printf '%s' "$KEY" | wc -c)-character anon key."
          else
            echo "::warning::No anon key found; the build will be local-only without sign-in."
          fi
          {
            echo 'key<<IPA_EOF'
            printf '%s\n' "$KEY"
            echo 'IPA_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test (widget/unit only)
        run: flutter test test/app_test.dart

      - name: Build release IPA
        env:
          SUPABASE_ANON_KEY: ${{ steps.key.outputs.key }}
        run: |
          flutter build ipa --release \
            --dart-define=SUPABASE_ANON_KEY='${SUPABASE_ANON_KEY}'

      - name: Report artifact
        run: |
          ls -l build/ios/ipa/hadeeth_id_mobile.ipa 2>/dev/null || find build -name '*.ipa' -ls
          if [ -f build/ios/ipa/hadeeth_id_mobile.ipa ]; then
            echo "### iOS App" >> "$GITHUB_STEP_SUMMARY"
            echo "\`hadeeth_id_mobile.ipa\` — $(du -h build/ios/ipa/hadeeth_id_mobile.ipa | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "SHA-256: \`$(sha256sum build/ios/ipa/hadeeth_id_mobile.ipa | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hadeeth-id-ios-ipa
          path: |
            build/ios/ipa/hadeeth_id_mobile.ipa
            build/**/*.ipa
          if-no-files-found: warn
          retention-days: 90