<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Link Database Viewer</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#1e3a8a',
            secondary: '#0f766e',
            surface: '#ffffff',
            background: '#f8fafc',
            'on-surface': '#1e293b',
          }
        }
      }
    }
  </script>
  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.tailwindcss.min.css">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    .dataTables_wrapper .dataTables_paginate .paginate_button {
      padding: 0.25rem 0.75rem;
      margin-left: 0.25rem;
      border-radius: 0.375rem;
      border: 1px solid #e2e8f0;
      background: white;
    }
    .dataTables_wrapper .dataTables_paginate .paginate_button.current {
      background: #1e3a8a;
      color: white !important;
      border-color: #1e3a8a;
    }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen">
  <div class="max-w-7xl mx-auto px-4 py-8">
    <header class="bg-manuscript-paper dark:bg-[#10141a] border-b border-outline-variant dark:border-[#1e293b] sticky top-0 z-50">
  <div class="flex justify-between items-center w-full px-margin-main max-w-content-width-max mx-auto h-16">
    <a href="index.html" class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg overflow-hidden flex items-center justify-center bg-[#0a1120] border border-outline-variant/30"><img src="assets/logo_light.jpg" alt="hadeeth.id logo" class="logo-light w-full h-full object-cover rounded-lg scale-125"/><img src="assets/logo_dark.jpg" alt="hadeeth.id logo" class="logo-dark w-full h-full object-cover rounded-lg scale-125"/></div>
      <span class="font-bold text-xl text-primary dark:text-white tracking-tight">hadeeth.id</span>
    </a>
    <nav class="hidden md:flex items-center gap-stack-lg">
      <a href="books.html"   data-nav-page="books.html" data-i18n="nav_books" class="text-on-surface-variant dark:text-gray-400 hover:text-primary dark:hover:text-white py-1 transition-colors">Books</a>
      <a href="topics.html"   data-nav-page="topics.html" data-i18n="nav_topics" class="text-on-surface-variant dark:text-gray-400 hover:text-primary dark:hover:text-white py-1 transition-colors">Topics</a>
      <a href="scholars.html" data-nav-page="scholars.html" data-i18n="nav_scholars" class="text-on-surface-variant dark:text-gray-400 hover:text-primary dark:hover:text-white py-1 transition-colors">Scholars</a>
      <a href="admin.html"   data-nav-page="admin.html" data-i18n="nav_admin" class="text-on-surface-variant dark:text-gray-400 hover:text-primary dark:hover:text-white py-1 transition-colors">Admin</a>
    </nav>
    <div class="flex items-center gap-2 text-on-surface-variant dark:text-gray-400">
      <!-- Language Switcher -->
      <div class="flex items-center gap-1 bg-surface dark:bg-[#1e293b] border border-outline-variant/40 dark:border-[#334155] rounded-full px-1 py-1">
        <button data-lang-btn="en" class="lang-btn text-xs font-bold px-2.5 py-1 rounded-full transition-all" title="English">EN</button>
        <button data-lang-btn="id" class="lang-btn text-xs font-bold px-2.5 py-1 rounded-full transition-all" title="Indonesian">ID</button>
      </div>
      <button data-toggle-theme class="p-2 hover:bg-surface-container-low dark:hover:bg-[#1e293b] rounded-full transition-colors" aria-label="Toggle theme">
        <span class="material-symbols-outlined" data-theme-icon>dark_mode</span>
      </button>
      <button id="mobile-menu-btn" class="p-2 md:hidden hover:bg-surface-container-low dark:hover:bg-[#1e293b] rounded-full transition-colors">
        <span class="material-symbols-outlined" data-menu-icon>menu</span>
      </button>
    </div>
  </div>
  <!-- Mobile Menu -->
  <div id="mobile-menu" class="md:hidden bg-manuscript-paper dark:bg-[#10141a] border-t border-outline-variant dark:border-[#1e293b]">
    <div class="flex flex-col px-margin-main py-2 gap-1">
      <a href="books.html"   class="py-2 text-on-surface-variant dark:text-gray-400 hover:text-primary dark:hover:text-white" data-i18n="nav_books">Books</a>
      <a href="topics.html"   class="py-2 text-on-surface-variant dark:text-gray-400 hover:text-primary dark:hover:text-white" data-i18n="nav_topics">Topics</a>
      <a href="scholars.html" class="py-2 text-on-surface-variant dark:text-gray-400 hover:text-primary dark:hover:text-white" data-i18n="nav_scholars">Scholars</a>
      <a href="admin.html"   class="py-2 text-on-surface-variant dark:text-gray-400 hover:text-primary dark:hover:text-white" data-i18n="nav_admin">Admin</a>
    </div>
  </div>
</header>

    <div class="bg-surface shadow-sm rounded-xl p-6 border border-gray-200 mb-6">
      <div class="flex items-center gap-4">
        <label for="book-select" class="font-semibold text-gray-700">Select Book:</label>
        <select id="book-select" class="border border-gray-300 rounded-lg px-4 py-2 bg-white focus:ring-2 focus:ring-primary focus:outline-none min-w-[200px]">
          <option value="">Loading books...</option>
        </select>
        <div id="loading-indicator" class="text-sm text-blue-600 font-medium hidden">
          <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-blue-600 inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Loading data...
        </div>
      </div>
    </div>

    <div class="bg-surface shadow-sm rounded-xl p-6 border border-gray-200">
      <table id="link-table" class="w-full text-left border-collapse" style="width:100%">
        <thead>
          <tr class="bg-gray-50 border-b border-gray-200">
            <th class="px-4 py-3 font-semibold text-gray-700">Anchor ID</th>
            <th class="px-4 py-3 font-semibold text-gray-700">Anchor Source</th>
            <th class="px-4 py-3 font-semibold text-gray-700">Lidwa ID (SQL)</th>
            <th class="px-4 py-3 font-semibold text-gray-700">Lidwa H-Num</th>
            <th class="px-4 py-3 font-semibold text-gray-700">AhmedBaset ID</th>
            <th class="px-4 py-3 font-semibold text-gray-700">Kaggle Narrators</th>
          </tr>
        </thead>
        <tbody>
          <!-- Populated by JS -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- jQuery and DataTables -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.tailwindcss.min.js"></script>

  <script>
    let masterData = null;
    let dataTable = null;

    $(document).ready(async function() {
      // Initialize empty DataTable
      dataTable = $('#link-table').DataTable({
        responsive: true,
        pageLength: 50,
        deferRender: true,
        order: [[0, 'asc']], // Order by Anchor ID by default, but it's string so 1, 10, 2
        columnDefs: [
          { targets: 0, type: 'num' } // Try numeric sorting for Anchor ID
        ]
      });

      $('#loading-indicator').removeClass('hidden');

      try {
        const response = await fetch('data/links/master_link.json');
        masterData = await response.json();
        
        // Populate select
        const bookSelect = $('#book-select');
        bookSelect.empty();
        
        const books = Object.keys(masterData);
        books.forEach((book, idx) => {
          bookSelect.append(new Option(book, book, idx === 0, idx === 0));
        });
        
        $('#loading-indicator').addClass('hidden');
        
        // Load initial data
        if (books.length > 0) {
          loadBookData(books[0]);
        }
        
      } catch (err) {
        console.error("Failed to load master_link.json", err);
        $('#loading-indicator').text('Error loading data').addClass('text-red-500');
      }

      // Handle select change
      $('#book-select').on('change', function() {
        loadBookData($(this).val());
      });
    });

    function loadBookData(bookId) {
      if (!masterData || !masterData[bookId]) return;
      
      const bookData = masterData[bookId];
      const rows = [];
      
      for (const [anchorId, data] of Object.entries(bookData)) {
        let narrators = data.kaggle_narrators || [];
        let narratorsHtml = '';
        if (narrators.length > 0) {
            narratorsHtml = `<span class="px-2 py-1 bg-green-100 text-green-800 text-xs rounded-md border border-green-200" title="${narrators.join(', ')}">${narrators.length} narrators</span>`;
        } else {
            narratorsHtml = `<span class="text-gray-400 text-xs">-</span>`;
        }
        
        rows.push([
          anchorId,
          `<span class="px-2 py-0.5 rounded text-xs font-semibold ${data.anchor_source === 'lidwa' ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700'}">${data.anchor_source}</span>`,
          data.lidwa_id || '<span class="text-gray-400">-</span>',
          data.lidwa_hnum || '<span class="text-gray-400">-</span>',
          data.ahmedbaset_id || '<span class="text-gray-400">-</span>',
          narratorsHtml
        ]);
      }
      
      dataTable.clear().rows.add(rows).draw();
    }
  </script>
</body>
</html>
