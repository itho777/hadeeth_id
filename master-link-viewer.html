<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Link Database Viewer</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#1e3a8a',
            secondary: '#0f766e',
            surface: '#ffffff',
            background: '#f8fafc',
            'on-surface': '#1e293b',
          }
        }
      }
    }
  </script>
  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.tailwindcss.min.css">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    .dataTables_wrapper .dataTables_paginate .paginate_button {
      padding: 0.25rem 0.75rem;
      margin-left: 0.25rem;
      border-radius: 0.375rem;
      border: 1px solid #e2e8f0;
      background: white;
    }
    .dataTables_wrapper .dataTables_paginate .paginate_button.current {
      background: #1e3a8a;
      color: white !important;
      border-color: #1e3a8a;
    }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen">
  <div class="max-w-7xl mx-auto px-4 py-8">
    <header class="mb-8">
      <h1 class="text-3xl font-bold text-primary mb-2">Master Link Database Viewer</h1>
      <p class="text-gray-600">Explore the cross-dataset mappings from <code class="bg-gray-200 px-1 py-0.5 rounded text-sm">data/links/master_link.json</code></p>
    </header>

    <div class="bg-surface shadow-sm rounded-xl p-6 border border-gray-200 mb-6">
      <div class="flex items-center gap-4">
        <label for="book-select" class="font-semibold text-gray-700">Select Book:</label>
        <select id="book-select" class="border border-gray-300 rounded-lg px-4 py-2 bg-white focus:ring-2 focus:ring-primary focus:outline-none min-w-[200px]">
          <option value="">Loading books...</option>
        </select>
        <div id="loading-indicator" class="text-sm text-blue-600 font-medium hidden">
          <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-blue-600 inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Loading data...
        </div>
      </div>
    </div>

    <div class="bg-surface shadow-sm rounded-xl p-6 border border-gray-200">
      <table id="link-table" class="w-full text-left border-collapse" style="width:100%">
        <thead>
          <tr class="bg-gray-50 border-b border-gray-200">
            <th class="px-4 py-3 font-semibold text-gray-700">Anchor ID</th>
            <th class="px-4 py-3 font-semibold text-gray-700">Anchor Source</th>
            <th class="px-4 py-3 font-semibold text-gray-700">Lidwa ID (SQL)</th>
            <th class="px-4 py-3 font-semibold text-gray-700">Lidwa H-Num</th>
            <th class="px-4 py-3 font-semibold text-gray-700">AhmedBaset ID</th>
            <th class="px-4 py-3 font-semibold text-gray-700">Kaggle Narrators</th>
          </tr>
        </thead>
        <tbody>
          <!-- Populated by JS -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- jQuery and DataTables -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.tailwindcss.min.js"></script>

  <script>
    let masterData = null;
    let dataTable = null;

    $(document).ready(async function() {
      // Initialize empty DataTable
      dataTable = $('#link-table').DataTable({
        responsive: true,
        pageLength: 50,
        deferRender: true,
        order: [[0, 'asc']], // Order by Anchor ID by default, but it's string so 1, 10, 2
        columnDefs: [
          { targets: 0, type: 'num' } // Try numeric sorting for Anchor ID
        ]
      });

      $('#loading-indicator').removeClass('hidden');

      try {
        const response = await fetch('data/links/master_link.json');
        masterData = await response.json();
        
        // Populate select
        const bookSelect = $('#book-select');
        bookSelect.empty();
        
        const books = Object.keys(masterData);
        books.forEach((book, idx) => {
          bookSelect.append(new Option(book, book, idx === 0, idx === 0));
        });
        
        $('#loading-indicator').addClass('hidden');
        
        // Load initial data
        if (books.length > 0) {
          loadBookData(books[0]);
        }
        
      } catch (err) {
        console.error("Failed to load master_link.json", err);
        $('#loading-indicator').text('Error loading data').addClass('text-red-500');
      }

      // Handle select change
      $('#book-select').on('change', function() {
        loadBookData($(this).val());
      });
    });

    function loadBookData(bookId) {
      if (!masterData || !masterData[bookId]) return;
      
      const bookData = masterData[bookId];
      const rows = [];
      
      for (const [anchorId, data] of Object.entries(bookData)) {
        let narrators = data.kaggle_narrators || [];
        let narratorsHtml = '';
        if (narrators.length > 0) {
            narratorsHtml = `<span class="px-2 py-1 bg-green-100 text-green-800 text-xs rounded-md border border-green-200" title="${narrators.join(', ')}">${narrators.length} narrators</span>`;
        } else {
            narratorsHtml = `<span class="text-gray-400 text-xs">-</span>`;
        }
        
        rows.push([
          anchorId,
          `<span class="px-2 py-0.5 rounded text-xs font-semibold ${data.anchor_source === 'lidwa' ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700'}">${data.anchor_source}</span>`,
          data.lidwa_id || '<span class="text-gray-400">-</span>',
          data.lidwa_hnum || '<span class="text-gray-400">-</span>',
          data.ahmedbaset_id || '<span class="text-gray-400">-</span>',
          narratorsHtml
        ]);
      }
      
      dataTable.clear().rows.add(rows).draw();
    }
  </script>
</body>
</html>
